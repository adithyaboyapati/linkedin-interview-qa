[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "RUF",  # ruff
]
ignore = [
    "E501",   # prompts and selectors are intentionally long
    "B904",   # exception chaining is optional at CLI/scraper boundaries
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF015"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true
